[package]
name = "w-monitor-lite"
version = "1.0.80"
edition = "2021"
license = "MIT"
description = "Read-only Linux host monitoring agent. No remote control or self-updater."
repository = "https://github.com/agi-wang/w-monitor-lite"
publish = false

[workspace]
members = ["protocol", "vendor/w-hostmetrics"]
resolver = "2"

[dependencies]
w-monitor-lite-protocol = { path = "protocol" }
w-hostmetrics = { path = "vendor/w-hostmetrics" }
anyhow = "1.0"
base64 = "0.23"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.6", features = ["derive", "env"] }
flate2 = "1.1"
futures-util = "0.3"
hex = "0.4"
libc = "0.2"
parking_lot = "0.12"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls-no-provider", "stream"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
sysinfo = "0.39"
tokio = { version = "1.52", features = ["rt-multi-thread", "macros", "signal", "time", "sync", "process", "io-util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
strip = "none"
