[package]
name = "w-monitor-lite-protocol"
version = "1.0.80"
edition = "2021"
license = "MIT"
publish = false

[lib]
name = "w_monitor_sdk"

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
gethostname = "1.1"
libc = "0.2"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
